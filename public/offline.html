<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0c">
  <title>Offline · Murlan</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#20372f,#0d1715 35%,#080b0c 75%);color:#f5edda;font-family:Arial,sans-serif}.card{width:min(100%,480px);padding:38px;border:1px solid rgba(217,173,85,.3);border-radius:18px;background:rgba(12,17,16,.9);text-align:center;box-shadow:0 30px 80px #000}.crest{width:64px;height:72px;margin:auto;display:grid;place-items:center;border:1px solid #d9ad55;color:#f0cc77;font:24px Georgia,serif;clip-path:polygon(50% 0,100% 18%,88% 82%,50% 100%,12% 82%,0 18%)}h1{font:38px Georgia,serif;color:#fff3d5}p{color:#a99f8d;line-height:1.6}button{margin-top:14px;border:0;border-radius:7px;padding:14px 22px;background:linear-gradient(135deg,#b78a3e,#e1bd6c);color:#15120b;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="crest">M</div>
    <h1>Murlan è offline</h1>
    <p>La partita è al sicuro. Riconnettiti e riprova.<br>Game saved. Reconnect and try again.<br>Partida guardada. Reconecta e inténtalo de nuevo.<br>Loja është ruajtur. Rilidhu dhe provo përsëri.</p>
    <button onclick="location.reload()">Riprova · Retry · Reintentar · Provo</button>
  </main>
</body>
</html>
